<!DOCTYPE HTML>
<html>
<head>
<title>MDN x tests</title>
<style>
div {
  position: relative;
  width: 60px;
  height: 60px;
  left: 100px;
  background-color: skyblue;
}

.moved {
  transform: perspective(500px) translateZ(200px);
  background-color: pink;
}
</style>
</head>

<body>

<h1>MDN x Tests</h1>

<div>Static</div>
<div class="moved">Moved</div>
<div>Static</div>

</body>
</html>
