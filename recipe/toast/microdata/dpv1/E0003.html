		Spam about Seasonal Offers
	</span>
  </div>
</div>

<div itemtype="https://w3id.org/dpv#Purpose" itemscope>
  <div itemtype="https://w3id.org/dpv/ex#MarketingSeasonalOffer2021" itemscope>
    <div itemprop="http://www.w3.org/2004/02/skos/core#broader" itemtype="https://w3id.org/dpv#Marketing" itemscope></div>
	<span itemtype="https://www.w3.org/2000/01/rdf-schema#Label" itemscope lang="en">
		Spamming with Seasonal Offers
	</span>
  </div>
</div>
