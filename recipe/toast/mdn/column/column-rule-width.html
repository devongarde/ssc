<!DOCTYPE HTML>
<html>
<head>
<title>MDN column-rule-width tests</title>
<style>
.sid {
/* Keyword values */
column-rule-width: thin;
column-rule-width: medium;
column-rule-width: thick;

/* <length> values */
column-rule-width: 1px;
column-rule-width: 2.5em;

/* Global values */
column-rule-width: inherit;
column-rule-width: initial;
column-rule-width: revert;
column-rule-width: revert-layer;
column-rule-width: unset;
}

p {
  column-count: 3;
  column-rule-style: solid;
  column-rule-width: thick;
}
</style>
</head>

<body>

<h1>MDN column-rule-width Tests</h1>

<p>
  This is a bunch of text split into three columns. The `column-rule-width`
  property is used to change the width of the line that is drawn between
  columns. Don't you think that's wonderful?
</p>

</body>
</html>
