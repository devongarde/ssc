<!DOCTYPE HTML>
<html>
<head>
<title>math 4 semantics</title>
</head>

<body>

<h1>math 4 semantics</h1>

<math>

<semantics>
  <mrow>
    <mrow>
      <mi>sin</mi>
      <mo>&#x2061;<!--ApplyFunction--></mo>
      <mrow><mo>(</mo><mi>x</mi><mo>)</mo></mrow>
    </mrow>
    <mo>+</mo>
    <mn>5</mn>
  </mrow>
  <annotation-xml cd="mathmlkeys" name="contentequiv" encoding="MathML-Content">
    <apply>
      <plus/>
      <apply><sin/><ci>x</ci></apply>
      <cn>5</cn>
    </apply>
  </annotation-xml>
  <annotation encoding="application/x-tex">\sin x + 5</annotation>
</semantics>

</math>

</body>
</html>
