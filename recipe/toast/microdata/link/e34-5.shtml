<div><h1 itemprop="name">
escher poetry &mdash; [Z] :: 5
</h1></div>
<div id=poem itemprop="text">

<p>
WTF<br>
is my handwriting<br>
doing here
</p>

<p>
it&rsquo;s clear &amp; obvious<br>
until ten minutes past
</p>

<p>
now i see a plea<br>
for the fishes in the sea<br>
to drink more tea
</p>

<p>
gordon bennett<br>
i&rsquo;m receding<br>
into childtime
</p>
