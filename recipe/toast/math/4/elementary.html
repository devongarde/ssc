<!DOCTYPE HTML>
<html>
<head>
<title>math 4 elementary</title>
</head>

<body>

<h1>math 4 elementary</h1>

<math>

<mstack>
  <mn>424</mn>
  <msrow> <mo>+</mo> <mrow/> <mn>33</mn> </msrow>
  <msline/>
</mstack>

<mstack>
  <mn>123</mn>
  <msrow> <mn>456</mn> <mo>+</mo> </msrow>
  <msline/>
  <mn>579</mn>
</mstack>

<mstack>
  <mscarries crossout='updiagonalstrike'>
    <mn>2</mn>  <mn>12</mn>  <mscarry crossout='none'> <mrow/> </mscarry>
  </mscarries>
  <mn>2,327</mn>
  <msrow> <mo>-</mo> <mn> 1,156</mn> </msrow>
  <msline/>
  <mn>1,171</mn>
</mstack>

<mstack>
  <mscarries location='nw'>
    <mrow/>
    <mscarry crossout='updiagonalstrike' location='n'> <mn>2</mn> </mscarry>
    <mn>1</mn>
    <mrow/>
  </mscarries>
  <mn>2,327</mn>
  <msrow> <mo>-</mo> <mn> 1,156</mn> </msrow>
  <msline/>
  <mn>1,171</mn>
</mstack>

<mstack>
  <mscarries>
    <mscarry crossout='updiagonalstrike'><mrow/></mscarry>
    <menclose notation='bottom'> <mn>10</mn> </menclose>
  </mscarries>
  <mn>52</mn>
  <msrow> <mo>-</mo> <mn> 7</mn> </msrow>
  <msline/>
  <mn>45</mn>
</mstack>

<mstack>
  <msgroup>
    <mn>123</mn>
    <msrow><mo>×</mo><mn>321</mn></msrow>
  </msgroup>
  <msline/>
  <msgroup shift="1">
    <mn>123</mn>
    <mn>246</mn>
    <mn>369</mn>
  </msgroup>
  <msline/>
</mstack>

<mstack>
  <mscarries><mn>1</mn><mn>1</mn><mrow/></mscarries>
  <mscarries><mn>1</mn><mn>1</mn><mrow/></mscarries>
  <mn>1,234</mn>
  <msrow><mo>×</mo><mn>4,321</mn></msrow>
  <msline/>

  <mscarries position='2'>
    <mn>1</mn>
    <mrow/>
    <mn>1</mn>
    <mn>1</mn>
    <mn>1</mn>
    <mrow/>
    <mn>1</mn>
  </mscarries>
  <msgroup shift="1">
    <mn>1,234</mn>
    <mn>24,68</mn>
    <mn>370,2</mn>
    <msrow position="1"> <mn>4,936</mn> </msrow>
  </msgroup>
  <msline/>

  <mn>5,332,114</mn>
</mstack>

<mlongdiv longdivstyle="lefttop">
  <mn> 3 </mn>
  <mn> 435.3</mn>

  <mn> 1306</mn>

  <msgroup position="2" shift="-1">
    <msgroup>
      <mn> 12</mn>
      <msline length="2"/>
    </msgroup>
    <msgroup>
      <mn> 10</mn>
      <mn> 9</mn>
      <msline length="2"/>
    </msgroup>
    <msgroup>
      <mn> 16</mn>
      <mn> 15</mn>
      <msline length="2"/>
      <mn> 1.0</mn>           <!-- aligns on '.', not the right edge ('0') -->
    </msgroup>
    <msgroup position='-1'>   <!-- extra shift to move to the right of the "." -->
      <mn> 9</mn>
      <msline length="3"/>
      <mn> 1</mn>
    </msgroup>
  </msgroup>
</mlongdiv>

<mstyle decimalpoint=",">
  <mlongdiv longdivstyle="stackedleftlinetop">
    <mn> &#x663; </mn>
    <mn> &#x664;&#x663;٥٫&#x663;</mn>

    <mn> &#x661;&#x663;&#x660;&#x666;</mn>
    <msgroup position="2" shift="-1">
      <msgroup>
        <mn> &#x661;&#x662;</mn>
        <msline length="2"/>
      </msgroup>
      <msgroup>
        <mn> &#x661;&#x660;</mn>
        <mn> &#x669;</mn>
        <msline length="2"/>
      </msgroup>
      <msgroup>
        <mn> &#x661;&#x666;</mn>
        <mn> &#x661;٥</mn>
        <msline length="2"/>
        <mn> &#x661;٫&#x660;</mn>
      </msgroup>
      <msgroup position='-1'>
        <mn> &#x669;</mn>
        <msline length="3"/>
        <mn> &#x661;</mn>
      </msgroup>
    </msgroup>
  </mlongdiv>
</mstyle>

<mstack stackalign="right">
  <msline length="1"/>
  <mn> 0.3333 </mn>
</mstack>

<mstack stackalign="right">
  <msline length="6"/>
  <mn> 0.142857 </mn>
</mstack>

<mstack stackalign="right">
  <mn> 0.142857 </mn>
  <msline length="6"/>
</mstack>

<mstack stackalign="right">
  <msrow> <mo>.</mo> <mrow/><mrow/><mrow/><mrow/> <mo>.</mo> </msrow>
  <mn> 0.142857 </mn>
</mstack>

</math>

</body>
</html>
