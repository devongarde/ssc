<!DOCTYPE HTML>
<html lang="en">
<head>
<title>dpv 1 ontology test 27</title>
</head>

<body>

<h1>dpv 1 ontology test 27</h1>

<div itemtype="https://w3id.org/dpv/ex#Acme" itemscope>
  <div itemprop="https://www.w3.org/1999/02/22-rdf-syntax-ns#type" itemtype="https://w3id.org/dpv#LegalEntity" itemscope></div>
  <span itemprop="https://w3id.org/dpv#hasName" lang="en">Acme</span>
  <span itemprop="https://w3id.org/dpv#hasAddress" lang="ga">Baile &Aacute;tha Cliath</span>
  <span itemprop="https://w3id.org/dpv#hasContact">email:acme@example.com</span> <!--#comment apologies for doing it properly -->
  <div itemprop="https://w3id.org/dpv#hasRepresentative" itemtype="https://w3id.org/dpv/ex#AcmeDPO" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasRepresentative" itemtype="https://w3id.org/dpv/ex#AcmeEUOrg" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasLocation" itemtype="https://w3id.org/dpv/ex#IE" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasLocation" itemtype="https://w3id.org/dpv/dpv-juris#Ireland" itemscope></div>
  <span itemprop="https://w3id.org/dpv#hasLocation" lang="ga">&Eacute;ire</span>
</div>

<!--#comment

Note the example uses an undefined DPV v1 ontology, dpv-juris. plus two data types which, according to the spec,
are not permitted on hasLocation.

ex:Acme rdf:type dpv:LegalEntity ;
    dpv:hasName "Acme"@en ;
    dpv:hasAddress "Dublin, Ireland"@en ;
    dpv:hasContact "acme@example.com" ;
    dpv:hasRepresentative ex:AcmeDPO,  # internal DPO
                          ex:AcmeEUOrg ; # EU Representative
    dpv:hasLocation iso:IE, # if an ISO vocabulary for country-codes is used
                    dpv-juris:Ireland, # dpv-juris proposed vocabulary
                    "Ireland"@en . # plain strings

ex:AcmeDPO rdf:type dpv:Representative ;
    dpv:hasEntity ex:Acme .
ex:AcmeEUOrg rdf:type dpv:LegalEntity, dpv:DataProtectionOfficer ;
    dpv:hasEntity ex:Acme ;
    dpv:hasLocation "EU"@en .

-->

</body>
</html>
