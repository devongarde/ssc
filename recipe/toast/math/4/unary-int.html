<!DOCTYPE HTML>
<html>
<head>
<title>math 4 unary int</title>
</head>

<body>

<h1>math 4 unary int</h1>

<math>

<apply><eq/>
  <apply><int/><sin/></apply>
  <cos/>
</apply>

<apply><int/>
  <interval><ci>a</ci><ci>b</ci></interval>
  <cos/>
</apply>

<mrow><mrow><mi>∫</mi><mi>sin</mi></mrow><mo>=</mo><mi>cos</mi></mrow>

<mrow>
  <msubsup><mi>∫</mi><mi>a</mi><mi>b</mi></msubsup><mi>cos</mi>
</mrow>

<apply><int/>
  <bvar><ci>x</ci></bvar>
  <lowlimit><cn>0</cn></lowlimit>
  <uplimit><cn>1</cn></uplimit>
  <apply><power/><ci>x</ci><cn>2</cn></apply>
</apply>

<mrow>
  <msubsup><mi>∫</mi><mn>0</mn><mn>1</mn></msubsup>
  <msup><mi>x</mi><mn>2</mn></msup>
  <mi>d</mi>
  <mi>x</mi>
</mrow>

</math>

</body>
</html>
