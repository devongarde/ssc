<!DOCTYPE HTML>
<html>
<head>
<title>MDN font-size tests</title>
<style>
.sid
{
/* <absolute-size> values */
font-size: xx-small;
font-size: x-small;
font-size: small;
font-size: medium;
font-size: large;
font-size: x-large;
font-size: xx-large;
font-size: xxx-large;

/* <relative-size> values */
font-size: smaller;
font-size: larger;

/* <length> values */
font-size: 12px;
font-size: 0.8em;

/* <percentage> values */
font-size: 80%;

/* math value */
font-size: math;

/* Global values */
font-size: inherit;
font-size: initial;
font-size: revert;
font-size: revert-layer;
font-size: unset;
}

p {
  font-size: 2em;
}

html {
  font-size: 100%;
}
span {
  font-size: 1.6em;
}

html {
  font-size: 100%;
}
span {
  font-size: 1.6rem;
}
</style>
</head>

<body>

<h1>MDN font-size Tests</h1>

<div>
  <span>Outer <span>inner</span> outer</span>
</div>

<span>Outer <span>inner</span> outer</span>

</body>
</html>
