<!DOCTYPE HTML>
<html>
<head>
<title>MDN x tests</title>
<style>
.sid
{
/* Select image based on resolution */
 background-image: image-set(
  "image1.jpg" 1x,
  "image2.jpg" 2x
);

 background-image: image-set(
  url("image1.jpg") 1x,
  url("image2.jpg") 2x

 background-image: image-set(
  linear-gradient(blue, white) 1x,

 background-image: image-set(
  url("image1.avif") type("image/avif"),

}

  width: 400px;

  background-image: image-set(

  );
}

.box {
