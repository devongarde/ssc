<!DOCTYPE HTML>
<html>
<head>
<title>math 4 binary relational</title>
</head>

<body>

<h1>math 4 binary relational</h1>

<math>

<apply><in/><ci>a</ci><ci type="set">A</ci></apply>

<apply><notin/><ci>a</ci><ci type="set">A</ci></apply>

<apply><notsubset/>
  <ci type="set">A</ci>
  <ci type="set">B</ci>
</apply>

<apply><notprsubset/>
  <ci type="set">A</ci>
  <ci type="set">B</ci>
</apply>

<apply><setdiff/>
  <ci type="set">A</ci>
  <ci type="set">B</ci>
</apply>

<mrow><mi>a</mi><mo>∈</mo><mi>A</mi></mrow>

<mrow><mi>a</mi><mo>∉</mo><mi>A</mi></mrow>

<mrow><mi>A</mi><mo>⊈</mo><mi>B</mi></mrow>

<mrow><mi>A</mi><mo>⊄</mo><mi>B</mi></mrow>

<mrow><mi>A</mi><mo>∖</mo><mi>B</mi></mrow>

</math>

</body>
</html>
