<!DOCTYPE HTML>
<html>
<head>
<title>math 4 limits</title>
</head>

<body>

<h1>math 4 limits</h1>

<math>

<tendsto/>

<semantics>
  <ci>tendsto</ci>
  <annotation-xml encoding="MathML-Content">
    <tendsto/>
  </annotation-xml>
</semantics>

<apply><limit/>
  <bvar><ci>x</ci></bvar>
  <condition>
    <apply><tendsto/><ci>x</ci><cn>0</cn></apply>
  </condition>
  <ci>expression-in-x</ci>
</apply>

<apply><csymbol cd="limit1">limit</csymbol>
  <cn>0</cn>
  <csymbol cd="limit1">null</csymbol>
  <bind><csymbol cd="fns1">lambda</csymbol>
    <bvar><ci>x</ci></bvar>
    <ci>expression-in-x</ci>
  </bind>
</apply>

</math>

</body>
</html>
