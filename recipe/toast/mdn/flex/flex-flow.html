<!DOCTYPE HTML>
<html>
<head>
<title>MDN flex-flow tests</title>
<style>
.sid {
/* flex-flow: <'flex-direction'> */
flex-flow: row;
flex-flow: row-reverse;
flex-flow: column;
flex-flow: column-reverse;

/* flex-flow: <'flex-wrap'> */
flex-flow: nowrap;
flex-flow: wrap;
flex-flow: wrap-reverse;

/* flex-flow: <'flex-direction'> and <'flex-wrap'> */
flex-flow: row nowrap;
flex-flow: column wrap;
flex-flow: column-reverse wrap-reverse;

/* Global values */
flex-flow: inherit;
flex-flow: initial;
flex-flow: revert;
flex-flow: revert-layer;
flex-flow: unset;
}

.container {
  flex-flow: column-reverse wrap;
}
</style>
</head>

<body>

<h1>MDN flex-flow Tests</h1>

</body>
</html>
