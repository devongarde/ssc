<!DOCTYPE HTML>
<html>
<head>
<title>math 4 annotation-xml</title>
</head>

<body>

<h1>math 4 annotation-xml</h1>

<math>

<annotation-xml cd="mathmlkeys" name="contentequiv" encoding="MathML-Content">
  <apply>
    <plus/>
    <apply><sin/><ci>x</ci></apply>
    <cn>5</cn>
  </apply>
</annotation-xml>

<annotation-xml encoding="application/openmath+xml">
  <OMA xmlns="http://www.openmath.org/OpenMath">
    <OMS cd="arith1" name="plus"/>
    <OMA><OMS cd="transc1" name="sin"/><OMV name="x"/></OMA>
    <OMI>5</OMI>
  </OMA>
</annotation-xml>

<annotation-xml encoding="application/xhtml+xml">
  <html xmlns="http://www.w3.org/1999/xhtml">
    <head><title>E</title></head>
    <body>
      <p>The base of the natural logarithms, approximately 2.71828.</p>
    </body>
  </html>
</annotation-xml>

</math>

<math>
  <semantics>
    <mi>a</mi>
    <annotation-xml encoding="text/html">
      <span>xxx</span>
    </annotation-xml>
  </semantics>
  <mo>+</mo>
  <mi>b</mi>
</math>

<math>
  <semantics>
    <mi>a</mi>
    <annotation-xml>
      <span>xxx</span>
    </annotation-xml>
  </semantics>
  <mo>+</mo>
  <mi>b</mi>
</math>

<math xmlns="http://www.w3.org/1998/Math/MathML">
  <semantics>
    <mi>a</mi>
    <annotation-xml>
    </annotation-xml>
  </semantics>
</math>
<span xmlns="http://www.w3.org/1999/xhtml">xxx</span>
<mo xmlns="http://www.w3.org/1999/xhtml">+</mo>
<mi xmlns="http://www.w3.org/1999/xhtml">b</mi>

</body>
</html>
