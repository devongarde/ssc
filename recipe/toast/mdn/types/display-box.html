<!DOCTYPE HTML>
<html>
<head>
<title>MDN display-box tests</title>
<style>
p.secret {
  display: none;
}

.outer {
  border: 2px solid red;
  width: 300px;
  display: contents;
}

.outer > div {
  border: 1px solid green;
}
</style>
</head>

<body>

<h1>MDN display-box Tests</h1>

<p>Visible text</p>
<p class="secret">Invisible text</p>

<div class="outer">
  <div>Inner div.</div>
</div>

</body>
</html>
