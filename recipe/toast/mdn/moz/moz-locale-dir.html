<!DOCTYPE HTML>
<html>
<head>
<title>MDN -moz-locale-dir- tests</title>
<style>
p:-moz-locale-dir(ltr) {
  color: red;
}
p:-moz-locale-dir(rtl) {
  color: green;
}
</style>
</head>

<body>

<h1>MDN -moz-locale-dir- Tests</h1>

<p>If you're using a left-to-right interface, this should be red.</p>

<p>If you're using a right-to-left interface, this should be green.</p>

</body>
</html>
