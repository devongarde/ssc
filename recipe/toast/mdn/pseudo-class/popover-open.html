<!DOCTYPE HTML>
<html>
<head>
<title>MDN popover-open tests</title>
<style>
[popover] {
  position: fixed;
  inset: 0;
  width: fit-content;
  height: fit-content;
  margin: auto;
  border: solid;
  padding: 0.25em;
  overflow: auto;
  color: CanvasText;
  background-color: Canvas;
}

:popover-open {
  width: 200px;
  height: 100px;
  position: absolute;
  inset: unset;
  bottom: 5px;
  right: 5px;
  margin: 0;
}
</style>
</head>

<body>

<h1>MDN popover-open Tests</h1>

</body>
</html>
