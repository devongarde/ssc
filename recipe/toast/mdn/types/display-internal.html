<!DOCTYPE HTML>
<html>
<head>
<title>MDN display-internal tests</title>
<style>
main {
  display: table;
}

div {
  display: table-row;
}

label,
input {
  display: table-cell;
  margin: 5px;
}
</style>
</head>

<body>

<h1>MDN display-internal Tests</h1>

<main>
  <div>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" />
  </div>
  <div>
    <label for="age">Age</label>
    <input type="text" id="age" name="age" />
  </div>
</main>

</body>
</html>
