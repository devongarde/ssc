<!DOCTYPE HTML>
<html>
<head>
<title>math 4 unary arithmetic</title>
</head>

<body>

<h1>math 4 unary arithmetic</h1>

<math>

<apply><factorial/><ci>n</ci></apply>

<apply><abs/><ci>x</ci></apply>

<apply><conjugate/>
  <apply><plus/>
    <ci>x</ci>
    <apply><times/><cn>ⅈ</cn><ci>y</ci></apply>
  </apply>
</apply>

<apply><arg/>
  <apply><plus/>
    <ci> x </ci>
    <apply><times/><imaginaryi/><ci>y</ci></apply>
  </apply>
</apply>

<apply><real/>
  <apply><plus/>
    <ci>x</ci>
    <apply><times/><imaginaryi/><ci>y</ci></apply>
  </apply>
</apply>

<apply><imaginary/>
  <apply><plus/>
    <ci>x</ci>
    <apply><times/><imaginaryi/><ci>y</ci></apply>
  </apply>
</apply>

<apply><floor/><ci>a</ci></apply>

<apply><ceiling/><ci>a</ci></apply>

<apply><exp/><ci>x</ci></apply>

<apply><minus/><cn>3</cn></apply>

<mrow><mi>n</mi><mo>!</mo></mrow>

<mrow><mo>|</mo><mi>x</mi><mo>|</mo></mrow>

<mover>
  <mrow>
    <mi>x</mi>
    <mo>+</mo>
    <mrow><mn>ⅈ</mn><mo>&#x2062;<!--InvisibleTimes--></mo><mi>y</mi></mrow>
  </mrow>
  <mo>¯</mo>
</mover>

<mrow>
  <mi>arg</mi>
  <mo>&#x2061;<!--ApplyFunction--></mo>
  <mrow>
   <mo>(</mo>
    <mrow>
      <mi>x</mi>
      <mo>+</mo>
      <mrow><mi>i</mi><mo>&#x2062;<!--InvisibleTimes--></mo><mi>y</mi></mrow>
    </mrow>
    <mo>)</mo>
  </mrow>
</mrow>

<mrow>
  <mo>ℛ</mo>
  <mo>&#x2061;<!--ApplyFunction--></mo>
  <mrow>
   <mo>(</mo>
    <mrow>
      <mi>x</mi>
      <mo>+</mo>
      <mrow><mi>i</mi><mo>&#x2062;<!--InvisibleTimes--></mo><mi>y</mi></mrow>
    </mrow>
    <mo>)</mo>
  </mrow>
</mrow>

<mrow>
  <mo>ℑ</mo>
  <mo>&#x2061;<!--ApplyFunction--></mo>
  <mrow>
   <mo>(</mo>
    <mrow>
      <mi>x</mi>
      <mo>+</mo>
      <mrow><mi>i</mi><mo>&#x2062;<!--InvisibleTimes--></mo><mi>y</mi></mrow>
    </mrow>
    <mo>)</mo>
  </mrow>
</mrow>

<mrow><mo>⌊</mo><mi>a</mi><mo>⌋</mo></mrow>

<mrow><mo>⌈</mo><mi>a</mi><mo>⌉</mo></mrow>

<msup><mi>e</mi><mi>x</mi></msup>

<mrow><mo>−</mo><mn>3</mn></mrow>

</math>

</body>
</html>
