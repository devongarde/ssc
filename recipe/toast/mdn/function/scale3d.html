<!DOCTYPE HTML>
<html>
<head>
<title>MDN x tests</title>
<style>
div {
  width: 80px;
  height: 80px;
  background-color: skyblue;
}

.scaled {
  transform: perspective(500px) scale3d(2, 0.7, 0.2) translateZ(100px);
  background-color: pink;
}

div {
  width: 80px;
  height: 80px;
  background-color: skyblue;
}

.scaled {
  transform: perspective(500px) scale3d(2, 0.7, 0.2) translateZ(100px);
  transform-origin: left;
  background-color: pink;
}
</style>
</head>

<body>

<h1>MDN x Tests</h1>

<div>Normal</div>
<div class="scaled">Scaled</div>

</body>
</html>
