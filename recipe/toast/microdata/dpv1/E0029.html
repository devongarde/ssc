<!DOCTYPE HTML>
<html lang="en">
<head>
<title>dpv 1 ontology test 29</title>
</head>

<body>

<h1>dpv 1 ontology test 29</h1>

<div itemtype="https://w3id.org/dpv/ex#DataStore" itemscope>
  <div itemprop="https://www.w3.org/1999/02/22-rdf-syntax-ns#type" itemtype="https://w3id.org/dpv#Technology" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasTechnicalMeasure" itemtype="https://w3id.org/dpv/ex#RBACCredential" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasRisk" itemtype="https://w3id.org/dpv/ex#UnAuthorisedAccess" itemscope></div>
</div>

<div itemtype="https://w3id.org/dpv/ex#UnAuthorisedAccess" itemscope>
  <div itemprop="https://www.w3.org/1999/02/22-rdf-syntax-ns#type" itemtype="https://w3id.org/dpv#Risk" itemscope></div>
  <span itemprop="https://w3id.org/dpv#hasConsequence" lang="en">Unauthorised Access to Data Store</span>
  <div itemprop="https://w3id.org/dpv#hasImpact" itemtype="https://w3id.org/dpv#Harm" itemscope></div>
  <div itemprop="https://w3id.org/dpv#isMitigatedByMeasure" itemtype="https://w3id.org/dpv/ex#RBACCredential" itemscope></div>
</div>

<div itemtype="https://w3id.org/dpv/ex#RBACCredential" itemscope>
  <div itemprop="https://www.w3.org/1999/02/22-rdf-syntax-ns#type" itemtype="https://w3id.org/dpv#TechnicalMeasure" itemscope></div>
  <div itemprop="https://www.w3.org/1999/02/22-rdf-syntax-ns#type" itemtype="https://w3id.org/dpv#RiskMitigationMeasure" itemscope></div>
  <div itemprop="http://www.w3.org/2004/02/skos/core#broader" itemtype="https://w3id.org/dpv#AccessControlMethod" itemscope></div>
  <div itemprop="https://w3id.org/dpv#mitigatesRisk" itemtype="https://w3id.org/dpv/ex#UnAuthorisedAccess" itemscope></div>
</div>

<div itemtype="https://w3id.org/dpv/ex#SecurityPolicy" itemscope>
  <div itemprop="https://www.w3.org/1999/02/22-rdf-syntax-ns#type" itemtype="https://w3id.org/dpv#OrganisationalMeasure" itemscope></div>
  <div itemprop="http://www.w3.org/2004/02/skos/core#broader" itemtype="https://w3id.org/dpv#Policy" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasOrganisationalMeasure" itemtype="https://w3id.org/dpv/ex#StaffTraining" itemscope></div>
  <div itemprop="https://w3id.org/dpv#mitigatesRisk" itemtype="https://w3id.org/dpv/ex#UnAuthorisedAccess" itemscope></div>
</div>

  ex:SecurityPolicy rdf:type dpv:OrganisationalMeasure ;

-->

</body>
</html>
