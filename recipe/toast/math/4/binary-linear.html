<!DOCTYPE HTML>
<html>
<head>
<title>math 4 binary linear algebra</title>
</head>

<body>

<h1>math 4 binary linear algebral</h1>

<math>

<apply><eq/>
  <apply><vectorproduct/>
    <ci type="vector"> A </ci>
    <ci type="vector"> B </ci>
  </apply>
  <apply><times/>
    <ci>a</ci>
    <ci>b</ci>
    <apply><sin/><ci>θ</ci></apply>
    <ci type="vector"> N </ci>
  </apply>
</apply>

<apply><eq/>
  <apply><scalarproduct/>
    <ci type="vector">A</ci>
    <ci type="vector">B</ci>
  </apply>
  <apply><times/>
    <ci>a</ci>
    <ci>b</ci>
    <apply><cos/><ci>θ</ci></apply>
  </apply>
</apply>

<apply><outerproduct/>
  <ci type="vector">A</ci>
  <ci type="vector">B</ci>
</apply>

<mrow>
  <mrow><mi>A</mi><mo>×</mo><mi>B</mi></mrow>
  <mo>=</mo>
  <mrow>
    <mi>a</mi>
    <mo>&#x2062;<!--InvisibleTimes--></mo>
    <mi>b</mi>
    <mo>&#x2062;<!--InvisibleTimes--></mo>
    <mrow><mi>sin</mi><mo>&#x2061;<!--ApplyFunction--></mo><mi>θ</mi></mrow>
    <mo>&#x2062;<!--InvisibleTimes--></mo>
    <mi>N</mi>
  </mrow>
</mrow>

<mrow>
  <mrow><mi>A</mi><mo>.</mo><mi>B</mi></mrow>
  <mo>=</mo>
  <mrow>
    <mi>a</mi>
    <mo>&#x2062;<!--InvisibleTimes--></mo>
    <mi>b</mi>
    <mo>&#x2062;<!--InvisibleTimes--></mo>
    <mrow><mi>cos</mi><mo>&#x2061;<!--ApplyFunction--></mo><mi>θ</mi></mrow>
  </mrow>
</mrow>

<mrow><mi>A</mi><mo>⊗</mo><mi>B</mi></mrow>

</math>

</body>
</html>
