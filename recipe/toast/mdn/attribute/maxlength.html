<!DOCTYPE HTML>
<html>
<head>
<title>MDN maxlength tests</title>
<style>
label {
  display: block;
  margin-top: 1em;
}

input:valid,
textarea:valid {
  background-color: palegreen;
}
</style>
</head>

<body>

<h1>MDN maxlength Tests</h1>

<label for="name">Product name:</label>
<input
  id="name"
  name="name"
  type="text"
  value="Shampoo"
  minlength="3"
  maxlength="20"
  required />

<label for="description">Product description:</label>
<textarea
  id="description"
  name="description"
  minlength="10"
  maxlength="40"
  required></textarea>

<input type="password" maxlength="4" />

</body>
</html>
