<!DOCTYPE HTML>
<html>
<head>
<title>MDN gradient tests</title>
<style>
.linear-gradient {
  background: linear-gradient(
    to right,
    red,
    orange,
    yellow,
    green,
    blue,
    indigo,
    violet
  );
}

.radial-gradient {
  background: radial-gradient(red, yellow, dodgerblue);
}

.conic-gradient {
  background: conic-gradient(pink, coral, lime);
}

.linear-repeat {
  background: repeating-linear-gradient(
    to top left,
    pink,
    pink 5px,
    white 5px,
    white 10px
  );
}

.radial-repeat {
  background: repeating-radial-gradient(
    lime,
    lime 15px,
    white 15px,
    white 30px
  );
}

.conic-repeat {
  background: repeating-conic-gradient(lime, pink 30deg);
}
</style>
</head>

<body>

<h1>MDN gradient Tests</h1>

</body>
</html>
