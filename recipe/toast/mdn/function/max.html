<!DOCTYPE HTML>
<html>
<head>
<title>MDN max tests</title>
<style>
.sid
{
font-size: max(1, 2, 3);
font-size: max(1px, 2px, 3px);
}

small {
  font-size: max(min(0.5vw, 0.5em), 1rem);
}

h1 {
  font-size: 2rem;
}
h1.responsive {
  font-size: max(4vw, 2em, 2rem);
}
</style>
</head>

<body>

<h1>MDN max Tests</h1>

<h1>This text is always legible, but doesn't change size</h1>
<h1 class="responsive">
  This text is always legible, and is responsive, to a point
</h1>

</body>
</html>
