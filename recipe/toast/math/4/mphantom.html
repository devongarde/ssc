<!DOCTYPE HTML>
<html>
<head>
<title>math 4 mphantom</title>
</head>

<body>

<h1>math 4 mphantom</h1>

<math>

<mfrac>
  <mrow>
    <mi> x </mi>
    <mo> + </mo>
    <mi> y </mi>
    <mo> + </mo>
    <mi> z </mi>
  </mrow>
  <mrow>
    <mi> x </mi>
    <mphantom>
      <mo form="infix"> + </mo>
      <mi> y </mi>
    </mphantom>
    <mo> + </mo>
    <mi> z </mi>
  </mrow>
</mfrac>

</math>

</body>
</html>
