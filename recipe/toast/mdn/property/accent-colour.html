<!DOCTYPE HTML>
<html>
<head>
<title>MDN accent-colour tests</title>
<style>
.sid {
/* Keyword values */
accent-color: auto;

/* <color> values */
accent-color: darkred;
accent-color: #5729e9;
accent-color: rgb(0 200 0);
accent-color: hsl(228 4% 24%);

/* Global values */
accent-color: inherit;
accent-color: initial;
accent-color: revert;
accent-color: revert-layer;
accent-color: unset;
}
input {
  accent-color: auto;
  display: block;
  width: 30px;
  height: 30px;
}

input.custom {
  accent-color: rebeccapurple;
}
</style>
</head>

<body>

<h1>MDN accent-colour Tests</h1>

<input type="checkbox" checked />
<input type="checkbox" class="custom" checked />

</body>
</html>
