<!DOCTYPE HTML>
<html lang="en-GB">

<head>
<title>aria media</title>
</head>

<body>

<h1>aria media</h1>

<audio controls src="fen1.mp3">
</audio>

<div role="application">
    <audio controls src="fen1.mp3">
    <track default kind="captions" srclang="en" src="index.html" />
    </audio>

    <video controls width=250>
      <source src="to_let.mov" type="video/quicktime" />
    </video>

    <video controls width=250>
      <source src="to_let.mov" type="video/quicktime" />
      <track default kind="captions" srclang="en" src="index.html" />
    </video>

    <video controls width=250>
      <source src="to_let.mov" type="video/quicktime" />
      <track default kind="captions" srclang="en" src="index.html" />
      <track default kind="descriptions" srclang="en" src="index.html" />
    </video>
</div>

</body>
</html>
