<!DOCTYPE HTML>
<html>
<head>
<title>MDN font-variant tests</title>
<style>
.sid
{
font-variant: small-caps;
font-variant: common-ligatures small-caps;

/* Global values */
font-variant: inherit;
font-variant: initial;
font-variant: revert;
font-variant: revert-layer;
font-variant: unset;
}

p.normal {
  font-variant: normal;
}
p.small {
  font-variant: small-caps;
}
</style>
</head>

<body>

<h1>MDN font-variant Tests</h1>

<p class="normal">Firefox rocks!</p>
<p class="small">Firefox rocks!</p>

</body>
</html>
