<!DOCTYPE HTML>
<html>
<head>
<title>math 4 piecewise</title>
</head>

<body>

<h1>math 4 piecewise</h1>

<math>

<piecewise>
  <piece>
    <apply><minus/><ci>x</ci></apply>
    <apply><lt/><ci>x</ci><cn>0</cn></apply>
  </piece>
  <piece>
    <cn>0</cn>
    <apply><eq/><ci>x</ci><cn>0</cn></apply>
  </piece>
  <piece>
    <ci>x</ci>
    <apply><gt/><ci>x</ci><cn>0</cn></apply>
  </piece>
</piecewise>

<mrow>
  <mo>{</mo>
  <mtable>
    <mtr>
      <mtd><mrow><mo>−</mo><mi>x</mi></mrow></mtd>
      <mtd columnalign="left"><mtext>&#xa0; if &#xa0;</mtext></mtd>
      <mtd><mrow><mi>x</mi><mo>&lt;</mo><mn>0</mn></mrow></mtd>
    </mtr>
    <mtr>
      <mtd><mn>0</mn></mtd>
      <mtd columnalign="left"><mtext>&#xa0; if &#xa0;</mtext></mtd>
      <mtd><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow></mtd>
    </mtr>
    <mtr>
      <mtd><mi>x</mi></mtd>
      <mtd columnalign="left"><mtext>&#xa0; if &#xa0;</mtext></mtd>
      <mtd><mrow><mi>x</mi><mo>&gt;</mo><mn>0</mn></mrow></mtd>
    </mtr>
  </mtable>
</mrow>

</math>

</body>
</html>
