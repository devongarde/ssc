<!DOCTYPE HTML>
<html>
<head>
<title>MDN LI tests</title>
<style>
p,
li {
  font:
    1rem "Fira Sans",
    sans-serif;
}

p {
  font-weight: bold;
}
</style>
</head>

<body>

<h1>MDN LI Tests</h1>

<ol>
  <li>first item</li>
  <li>second item</li>
  <li>third item</li>
</ol>

<ol type="I">
  <li value="3">third item</li>
  <li>fourth item</li>
  <li>fifth item</li>
</ol>

<ul>
  <li>first item</li>
  <li>second item</li>
  <li>third item</li>
</ul>

</body>
</html>
