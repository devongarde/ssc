<!DOCTYPE HTML>
<html lang="en">
<head>
<title>data privacy vocab 2 tech tests</title>
</head>

<body>

<h1>data privacy vocab 2 tech tests</h1>

<div itemtype="https://w3id.org/dpv#Technology" itemscope>
  <div itemprop="https://w3id.org/dpv/tech#hasIntendedUse" itemtype="https://w3id.org/dpv#Collect" itemscope></div>
  <div itemprop="https://w3id.org/dpv/tech#hasIntendedUse" itemtype="https://w3id.org/dpv#Store" itemscope></div>
  <span itemprop="http://www.w3.org/2000/01/rdf-schema#comment" lang="en">Technology intended to collect and store data</span>
</div>

<div itemtype="https://w3id.org/dpv#Technology" itemscope>
  <div itemprop="https://w3id.org/dpv/tech#hasIntendedUse" itemtype="https://w3id.org/dpv#IntendedUse" itemscope>
      <div itemprop="https://w3id.org/dpv#hasPersonalData" itemtype="https://w3id.org/dpv/pd#EmailAddress" itemscope></div>
      <div itemprop="https://w3id.org/dpv#hasPurpose" itemtype="https://w3id.org/dpv#Marketing" itemscope></div>
      <div itemprop="https://w3id.org/dpv#hasProcessing" itemtype="https://w3id.org/dpv#Collect" itemscope></div>
      <div itemprop="https://w3id.org/dpv#hasProcessing" itemtype="https://w3id.org/dpv#Store" itemscope></div>
      <div itemprop="https://w3id.org/dpv#hasProcessing" itemtype="https://w3id.org/dpv#Use" itemscope></div>
      <div itemprop="https://w3id.org/dpv#hasUser" itemtype="https://w3id.org/dpv#Employee" itemscope></div> <!--#comment error in original, hasUser is dpv-tech -->
      <span itemprop="http://www.w3.org/2000/01/rdf-schema#comment" lang="en">Technology intended to send makreting emails by employee</span>
  </div>
</div>

<div itemtype="https://w3id.org/dpv#Technology" itemscope>
  <div itemprop="https://w3id.org/dpv#isImplementedUsingTechnology" itemtype="https://example.org/ex#ChewingGum" itemscope></div>
  <div itemprop="https://w3id.org/dpv#isImplementedUsingTechnology" itemtype="https://example.org/ex#String" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasPurpose" itemtype="https://w3id.org/dpv#AccountManagement" itemscope></div>
</div>

<div itemtype="https://w3id.org/dpv#Technology" itemscope>
  <div itemprop="https://w3id.org/dpv#isImplementedUsingTechnology" itemtype="https://example.org/ex#ChewingGum" itemscope></div>
  <div itemprop="https://w3id.org/dpv#isImplementedUsingTechnology" itemtype="https://example.org/ex#String" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasPurpose" itemtype="https://w3id.org/dpv#IdentityAuthentication" itemscope></div>
</div>

<div itemtype="https://w3id.org/dpv#Technology" itemscope>
  <div itemprop="https://w3id.org/dpv#isImplementedUsingTechnology" itemtype="https://example.org/ex#ChewingGum" itemscope></div>
  <div itemprop="https://w3id.org/dpv#isImplementedUsingTechnology" itemtype="https://example.org/ex#String" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasPurpose" itemtype="https://w3id.org/dpv#AccountManagement" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasPurpose" itemtype="https://w3id.org/dpv#IdentityAuthentication" itemscope></div>
</div>
