<!DOCTYPE HTML>
<html lang="en">

<title>dpv 1 ontology test 4</title>
</head>

<body>

<h1>dpv 1 ontology test 4</h1>

<div itemtype="https://w3id.org/dpv/ex#MarketingOfNewProducts" itemscope>
  <div itemprop="isSubTypeOf" itemtype="https://w3id.org/dpv#Marketing" itemscope></div>
  <span itemtype="https://www.w3.org/2000/01/rdf-schema#Label" itemscope>
	Marketing of New Products
  </span>
</div>

<div itemtype="https://w3id.org/dpv/ex#NewslettersOffers" itemscope>
  <div itemprop="isSubTypeOf" itemtype="https://w3id.org/dpv/ex#MarketingOfNewProducts" itemscope></div>
  <span itemtype="https://www.w3.org/2000/01/rdf-schema#Label" itemscope>
	Newsletters about Offers
  </span>
</div>

<div itemtype="https://w3id.org/dpv/ex#EmailsSeasonalOffers" itemscope>
  <div itemprop="isSubTypeOf" itemtype="https://w3id.org/dpv/ex#MarketingOfNewProducts" itemscope></div>
  <span itemtype="https://www.w3.org/2000/01/rdf-schema#Label" itemscope>
	Emails about Seasonal Offers
  </span>
</div>

<div itemtype="https://w3id.org/dpv/ex#MarketingSeasonalOffer" itemscope>
  <div itemprop="isSubTypeOf" itemtype="https://w3id.org/dpv#Marketing" itemscope></div>
  <span itemtype="https://www.w3.org/2000/01/rdf-schema#Label" itemscope>
	Sending Email Newsletters with Seasonal Offers
  </span>
</div>
