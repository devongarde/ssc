<title>dpv 2 ontology test 2.1</title>

<body>

<h1>dpv 2 ontology test 2.1</h1>

<div id="Acme" itemtype="https://w3id.org/dpv#DataController" itemscope></div>

<div id="AcmeMarketing" itemtype="https://w3id.org/dpv/ex#Process" itemscope>
  <div itemprop="https://w3id.org/dpv#hasProcess" itemtype="https://w3id.org/dpv/ex#InternalAnalytics" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasProcess" itemtype="https://w3id.org/dpv/ex#SendingNewsletters" itemscope></div>
</div>

<div id="InternalAnalytics" itemtype="https://w3id.org/dpv/ex#Process" itemscope>
  <div itemprop="https://w3id.org/dpv#hasPersonalData" itemtype="https://w3id.org/dpv/pd#Email" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasProcessing" itemtype="https://w3id.org/dpv#Collect" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasProcessing" itemtype="https://w3id.org/dpv#Store" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasPurpose" itemtype="https://w3id.org/dpv#InternalResourceOptimisation" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasLegalBasis" itemtype="https://w3id.org/dpv#LegitimateInterestOfController" itemscope></div>
</div>

<div id="FooTech" itemtype="https://w3id.org/dpv#DataProcessor" itemscope></div>

<div id="SendingNewsletters" itemtype="https://w3id.org/dpv/ex#Process" itemscope>
  <div itemprop="https://w3id.org/dpv#hasPersonalData" itemtype="https://w3id.org/dpv/pd#Email" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasProcessing" itemtype="https://w3id.org/dpv#Share" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasPurpose" itemtype="https://w3id.org/dpv#Marketing" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasDataProcessor" itemtype="https://w3id.org/dpv/ex#FooTech" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasLegalBasis" itemtype="https://w3id.org/dpv#Consent" itemscope></div>
</div>
