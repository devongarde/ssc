<!DOCTYPE HTML>
<html>
<head>
<title>MDN box-ordinal-group tests</title>
<style>
.sid {
/* <integer> values */
box-ordinal-group: 1;
box-ordinal-group: 5;

/* Global values */
box-ordinal-group: inherit;
box-ordinal-group: initial;
box-ordinal-group: unset;
}

article:nth-child(1) {
  -webkit-box-ordinal-group: 2;
  -moz-box-ordinal-group: 2;
  box-ordinal-group: 2;
}

article:nth-child(2) {
  -webkit-box-ordinal-group: 1;
  -moz-box-ordinal-group: 1;
  box-ordinal-group: 1;
}
</style>
</head>

<body>

<h1>MDN box-ordinal-group Tests</h1>

</body>
</html>
