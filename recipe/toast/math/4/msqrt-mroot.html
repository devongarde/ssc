<!DOCTYPE HTML>
<html>
<head>
<title>math 4 msqrt/mroot</title>
</head>

<body>

<h1>math 4 msqrt/mroot</h1>

<math>

<msqrt> base </msqrt>
<mroot> base index </mroot>

<mrow>
  <mrow>
    <msqrt>
      <mi>x</mi>
    </msqrt>
    <mroot>
      <mi>x</mi>
      <mn>3</mn>
    </mroot>
  </mrow>
  <mo>=</mo>
  <msup>
    <mi>x</mi>
    <mrow>
      <mrow>
        <mn>1</mn>
        <mo>/</mo>
        <mn>2</mn>
      </mrow>
      <mo>+</mo>
      <mrow>
        <mn>1</mn>
        <mo>/</mo>
        <mn>3</mn>
      </mrow>
    </mrow>
  </msup>
</mrow>

</math>

</body>
</html>
