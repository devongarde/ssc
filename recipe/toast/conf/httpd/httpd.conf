[general]
class=
output=../out/httpd.out
ssi=
vcs=
verbose=5

[css]
verify=
version=2023++

[html]
version=2023/07/01

[link]
no-external=
xlink=
pretend=cgi-bin
local=
pretend=tgz

[microformat]
verify=

[nits]
nids=

[site]
domain=ssc.lu
extension=shtml
extension=html
index=index.shtml
root=../httpd

[shadow]
copy=all
root=../toast/tmp/httpd
file=../toast/tmp/httpd.ndx
space=
ignore=.spec
ignore=.conf
ignore=.bat
ignore=.sh
ignore=.model
msg=(c) 2024 dylan harris

