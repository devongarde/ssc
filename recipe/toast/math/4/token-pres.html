<!DOCTYPE HTML>
<html>
<head>
<title>math 4 token presentation</title>
</head>

<body>

<h1>math 4 token presentation</h1>

<math>

<cn type="rational"><mi>P</mi><sep/><mi>Q</mi></cn>

<apply><csymbol cd="nums1">rational</csymbol>
  <semantics>
    <ci>p</ci>
    <annotation-xml encoding="MathML-Presentation">
      <mi>P</mi>
    </annotation-xml>
  </semantics>
  <semantics>
    <ci>q</ci>
    <annotation-xml encoding="MathML-Presentation">
      <mi>Q</mi>
    </annotation-xml>
  </semantics>
</apply>

<ci><mi>P</mi></ci>

<semantics>
  <ci>p</ci>
  <annotation-xml encoding="MathML-Presentation">
    <mi>P</mi>
  </annotation-xml>
</semantics>

<ci>
  <msup><mi>C</mi><mn>2</mn></msup>
</ci>

<semantics>
  <ci>C2</ci>
  <annotation-xml encoding="MathML-Presentation">
    <msup><mi>C</mi><mn>2</mn></msup>
  </annotation-xml>
</semantics>

</math>

</body>
</html>
