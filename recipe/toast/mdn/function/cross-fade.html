<!DOCTYPE HTML>
<html>
<head>
<title>MDN x tests</title>
<style>
.sid
{
background-image: cross-fade(url("white.png") 0%, url("black.png") 100%); /* fully black */
background-image: cross-fade(url("white.png") 25%, url("black.png") 75%); /* 25% white, 75% black */
background-image: cross-fade(url("white.png") 50%, url("black.png") 50%); /* 50% white, 50% black */
background-image: cross-fade(url("white.png") 75%, url("black.png") 25%); /* 75% white, 25% black */
background-image: cross-fade(url("white.png") 100%, url("black.png") 0%); /* fully white */
background-image: cross-fade(url("green.png") 75%, url("red.png") 75%); /* both green and red at 75% */

background-image: cross-fade(url("white.png") 0%, url("black.png")); /* fully black */
background-image: cross-fade(url("white.png") 25%, url("black.png")); /* 25% white, 75% black */
background-image: cross-fade(url("white.png"), url("black.png")); /* 50% white, 50% black */
background-image: cross-fade(url("white.png") 75%, url("black.png")); /* 75% white, 25% black */
background-image: cross-fade(url("white.png") 100%, url("black.png")); /* fully white */
background-image: cross-fade(url("green.png") 75%, url("red.png") 75%); /* both green and red at 75% */

background-image: cross-fade(url("red.png"), url("yellow.png"), url("blue.png")); /* all three will be 33.3333% opaque */
background-image: cross-fade(url("red.png") 33.33%, url("yellow.png") 33.33%, url("blue.png") 33.33%);

background-image: cross-fade(url("white.png"), url("black.png"), 0%);   /* fully black */
background-image: cross-fade(url("white.png"), url("black.png"), 25%);  /* 25% white, 75% black */
background-image: cross-fade(url("white.png"), url("black.png"), 50%);  /* 50% white, 50% black */
background-image: cross-fade(url("white.png"), url("black.png"), 75%);  /* 75% white, 25% black */
background-image: cross-fade(url("white.png"), url("black.png"), 100%); /* fully white */
}

.cross-fade {
  width: 300px;
  height: 300px;
  background-image: -webkit-cross-fade(url("br.png"), url("tr.png"), 75%);
  background-image: cross-fade(url("br.png"), url("tr.png"), 75%);
}
</style>
</head>

<body>

<h1>MDN x Tests</h1>

<div class="cross-fade"></div>

</body>
</html>
