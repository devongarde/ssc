<!DOCTYPE HTML>
<html>
<head>
<title>MDN display-inside tests</title>
<style>
.box {
  background-color: rgb(224 206 247);
  border: 5px solid rebeccapurple;
  display: flow-root;
}

.float {
  float: left;
  width: 200px;
  height: 150px;
  background-color: white;
  border: 1px solid black;
  padding: 10px;
}
</style>
</head>

<body>

<h1>MDN display-inside Tests</h1>

<div class="box">
  <div class="float">I am a floated box!</div>
  <p>I am content inside the container.</p>
</div>

</body>
</html>
