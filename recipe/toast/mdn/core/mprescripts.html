<!DOCTYPE HTML>
<html>
<head>
<title>MDN mathml mprescripts tests</title>
</head>

<body>

<h1>MDN mathml mprescripts Tests</h1>

<math display="block">
  <mmultiscripts>
    <mi>X</mi> <!-- base expression -->
    <mi>a</mi> <!-- post-sub-script -->
    <mi>b</mi> <!-- post-sup-script -->
    <mprescripts />
    <mi>c</mi> <!-- pre-sub-script -->
    <mi>d</mi> <!-- pre-sup-script -->
  </mmultiscripts>
</math>

</body>
</html>
