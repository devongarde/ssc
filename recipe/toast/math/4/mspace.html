<!DOCTYPE HTML>
<html>
<head>
<title>math 4 mspace</title>
</head>

<body>

<h1>math 4 mspace</h1>

<math>

<mspace height="3ex" depth="2ex"/>

<msup>
  <mi> x </mi>
  <malignmark edge="right"/>
  <mn> 2 </mn>
</msup>

<msup>
  <mrow>
    <mi> x </mi>
    <malignmark edge="right"/>
  </mrow>
  <mn> 2 </mn>
</msup>

</math>

</body>
</html>
