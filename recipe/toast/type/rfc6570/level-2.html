<!DOCTYPE HTML>
<html lang="en">
<head>
<title>RFC 6570 level 2</title>
</head>

<body>

<h1>RFC 6570 level 2</h1>

<ol>
<li>
<a href="https://example.com/{+var}.html">var</a>
</li>
<li>
<a href="https://example.com/{+var}.html?{+hello}">hello</a>
</li>
<li>
<a href="https://example.com{+path}/{+var}.html">foo</a>
</li>
<li>
<a href="https://example.com/{+var}.html?ref={+path}/here">bar</a>
</li>
<li>
<a href="https://example.com/{+var}.html{#ref}">id</a>
</li>
<li>
<a href="https://example.com/{+var}.html{#hello}">hello</a>
</li>
</ol>

</body>
</html>
