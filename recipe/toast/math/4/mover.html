<!DOCTYPE HTML>
<html>
<head>
<title>math 4 mover</title>
</head>

<body>

<h1>math 4 mover</h1>

<math>

<mover> base overscript </mover>

<mrow>
  <mover accent="true">
    <mi> x </mi>
    <mo> ^ </mo>
  </mover>
  <mtext>&#x00A0;<!--nbsp-->versus&#x00A0;<!--nbsp--></mtext>
  <mover accent="false">
    <mi> x </mi>
    <mo> ^ </mo>
  </mover>
</mrow>

<mrow>
  <mover accent="true">
    <mrow>
      <mi> x </mi>
      <mo> + </mo>
      <mi> y </mi>
      <mo> + </mo>
      <mi> z </mi>
    </mrow>
    <mo> ⏞ </mo>
  </mover>
  <mtext>&#x00A0;<!--nbsp-->versus&#x00A0;<!--nbsp--></mtext>
  <mover accent="false">
    <mrow>
      <mi> x </mi>
      <mo> + </mo>
      <mi> y </mi>
      <mo> + </mo>
      <mi> z </mi>
    </mrow>
    <mo> ⏞ </mo>
  </mover>
</mrow>

</math>

</body>
</html>
