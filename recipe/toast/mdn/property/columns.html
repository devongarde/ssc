<!DOCTYPE HTML>
<html>
<head>
<title>MDN columns tests</title>
<style>
.sid {
/* Column width */
columns: 18em;

/* Column count */
columns: auto;
columns: 2;

/* Both column width and count */
columns: 2 auto;
columns: auto 12em;
columns: auto auto;

/* Global values */
columns: inherit;
columns: initial;
columns: revert;
columns: revert-layer;
columns: unset;
}

.content-box {
  columns: 3 auto;
}
</style>
</head>

<body>

<h1>MDN columns Tests</h1>

<p class="content-box">
  This is a bunch of text split into three columns using the CSS `columns`
  property. The text is equally distributed over the columns.
</p>

</body>
</html>
