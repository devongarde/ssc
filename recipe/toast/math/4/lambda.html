<!DOCTYPE HTML>
<html>
<head>
<title>math 4 lambda</title>
</head>

<body>

<h1>math 4 lambda</h1>

<math>

<lambda>
  <bvar><ci> x </ci></bvar>
  <domainofapplication><integers/></domainofapplication>
  <apply><sin/><ci> x </ci></apply>
</lambda>

<lambda>
  <domainofapplication><integers/></domainofapplication>
  <sin/>
</lambda>

<lambda>
  <bvar><ci>x</ci></bvar>
  <apply><sin/>
    <apply><plus/><ci>x</ci><cn>1</cn></apply>
  </apply>
</lambda>

<mrow>
  <mi>λ</mi>
  <mi>x</mi>
  <mo>.</mo>
  <mrow>
   <mo>(</mo>
    <mrow>
      <mi>sin</mi>
      <mo>&#x2061;<!--ApplyFunction--></mo>
      <mrow><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo></mrow>
    </mrow>
    <mo>)</mo>
  </mrow>
</mrow>
<mtext>&nbsp;or&nbsp;</mtext>
<mrow>
  <mi>x</mi>
  <mo>↦</mo>
  <mrow>
    <mi>sin</mi>
    <mo>&#x2061;<!--ApplyFunction--></mo>
    <mrow><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo></mrow>
  </mrow>
</mrow>

</math>

</body>
</html>
