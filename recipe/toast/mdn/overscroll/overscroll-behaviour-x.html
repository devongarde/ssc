<!DOCTYPE HTML>
<html>
<head>
<title>MDN overscroll-behaviour-x tests</title>
<style>
.sid {
/* Keyword values */
overscroll-behavior-x: auto; /* default */
overscroll-behavior-x: contain;
overscroll-behavior-x: none;

/* Global values */
overscroll-behavior-x: inherit;
overscroll-behavior-x: initial;
overscroll-behavior-x: revert;
overscroll-behavior-x: revert-layer;
overscroll-behavior-x: unset;
}

main > div {
  height: 300px;
  width: 500px;
  overflow: auto;
  position: relative;
  top: 100px;
  left: 100px;
  overscroll-behavior-x: contain;
}
</style>
</head>

<body>

<h1>MDN overscroll-behaviour-x Tests</h1>

</body>
</html>
