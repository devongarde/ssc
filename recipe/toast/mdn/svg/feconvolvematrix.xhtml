  xmlns:xlink="http://www.w3.org/1999/xlink">

    <filter id="emboss">
      <feConvolveMatrix
        kernelMatrix="3 0 0
                      0 0 0
                      0 0 -3" />

    x="0"
    y="0"
    height="200"
    width="200"
    filter="url(#emboss)" />
</svg>
