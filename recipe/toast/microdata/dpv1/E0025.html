<!DOCTYPE HTML>
<html lang="en">
<head>
<title>dpv 1 ontology test 25</title>
</head>

<body>

<h1>dpv 1 ontology test 25</h1>

<div itemtype="https://w3id.org/dpv/ex#UserConsent" itemscope>
  <div itemprop="https://www.w3.org/1999/02/22-rdf-syntax-ns#type" itemtype="https://w3id.org/dpv#Consent" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasDataSubject" itemtype="https://w3id.org/dpv/ex#AcmeConsentNotice" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasNotice" itemtype="https://w3id.org/dpv/ex#User12345" itemscope></div>
  <span itemprop="https://w3id.org/dpv#hasNotice">https://example.com/AcmeConsentNotice</span>
  <span itemprop="https://w3id.org/dpv#hasNotice">Notice-v3.456</span>
</div>

<div itemtype="https://w3id.org/dpv/ex#PDH" itemscope>
  <div itemprop="https://www.w3.org/1999/02/22-rdf-syntax-ns#type" itemtype="https://w3id.org/dpv#PersonalDataHandling" itemscope></div>
&hellip;
  <div itemprop="https://w3id.org/dpv#hasLegalBasis" itemtype="https://w3id.org/dpv#Consent" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasNotice" itemtype="https://w3id.org/dpv/ex#User12345" itemscope></div>
</div>

<div itemtype="https://w3id.org/dpv/ex#UserConsent" itemscope>
  <div itemprop="https://www.w3.org/1999/02/22-rdf-syntax-ns#type" itemtype="https://w3id.org/dpv#PersonalDataHandling" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasNotice" itemtype="https://w3id.org/dpv/ex#User12345" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasPersonalDataHandling" itemtype="https://w3id.org/dpv/ex#PDH" itemscope></div>
</div>
