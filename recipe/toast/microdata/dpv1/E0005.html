<!DOCTYPE HTML>
<html lang="en">
<head>
<title>dpv 1 ontology test 5</title>
</head>

<body>

<h1>dpv 1 ontology test 5</h1>

<div itemtype="https://w3id.org/dpv/ex#ActivityA" itemscope>
  <div itemprop="isSubTypeOf" itemtype="https://w3id.org/dpv#PersonalDataHandling" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasProcessing" itemtype="https://w3id.org/dpv/ex#Collect" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasProcessing" itemtype="https://w3id.org/dpv/ex#Use" itemscope></div>
</div>

<div itemtype="https://w3id.org/dpv/ex#CollectAndUse" itemscope>
  <div itemprop="http://www.w3.org/2004/02/skos/core#broader" itemtype="https://w3id.org/dpv/ex#Collect" itemscope></div>
  <div itemprop="http://www.w3.org/2004/02/skos/core#broader" itemtype="https://w3id.org/dpv/ex#Use" itemscope></div>
	<span itemtype="https://www.w3.org/2000/01/rdf-schema#Label" itemscope lang="en">
		Collect and Use data using User Device
	</span>
</div>

<div itemtype="https://w3id.org/dpv/ex#Activity" itemscope>
  <div itemprop="isSubTypeOf" itemtype="https://w3id.org/dpv#PersonalDataHandling" itemscope></div>
  <div itemprop="https://w3id.org/dpv#hasProcessing" itemtype="https://w3id.org/dpv/ex#CollectAndUse" itemscope></div>
</div>

<!--#comment

# Method 1: Ambiguous regarding independence of Collect and Use
ex:ActivityA a dpv:PersonalDataHandling ;
    dpv:hasProcessing ex:Collect, ex:Use .

# Method 2: Accuracy regarding combination of Collect and Use
ex:CollectAndUse skos:broader ex:Collect, ex:Use ;
    rdfs:label “Collect and Use data using User Device” .
ex:Activity a dpv:PersonalDataHandling ;
    dpv:hasProcessing ex:CollectAndUse .

-->

</body>
</html>
