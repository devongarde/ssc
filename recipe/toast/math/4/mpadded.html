<!DOCTYPE HTML>
<html>
<head>
<title>math 4 mpadded</title>
</head>

<body>

<h1>math 4 mpadded</h1>

<math>

<mrow>
  <mi>x</mi>
  <mpadded lspace="0.2em" voffset="0.3ex">
    <mi>y</mi>
  </mpadded>
  <mi>z</mi>
</mrow>

<mrow>
  <mi>x</mi>
  <mpadded width="190%" height="calc(100% +0.3ex)" depth="calc(100% +0.3ex)">
    <mi>y</mi>
  </mpadded>
  <mi>z</mi>
</mrow>

<mrow>
  <mi>x</mi>
  <mpadded lspace="0.3em" width="calc(100% +0.6em)">
    <mi>y</mi>
  </mpadded>
  <mi>z</mi>
</mrow>

</math>

</body>
</html>
