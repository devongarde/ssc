<!DOCTYPE HTML>
<html>
<head>
<title>MDN descendant tests</title>
<style>
/* List items that are descendants of the "my-things" list */
ul.my-things li {
  margin: 2em;
}

li {
  list-style-type: disc;
}

li li {
  list-style-type: circle;
}
</style>
</head>

<body>

<h1>MDN descendant Tests</h1>

<ul>
  <li>
    <div>Item 1</div>
    <ul>
      <li>Subitem A</li>
      <li>Subitem B</li>
    </ul>
  </li>
  <li>
    <div>Item 2</div>
    <ul>
      <li>Subitem A</li>
      <li>Subitem B</li>
    </ul>
  </li>
</ul>

</body>
</html>
