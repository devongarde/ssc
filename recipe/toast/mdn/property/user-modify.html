<!DOCTYPE HTML>
<html>
<head>
<title>MDN user-modify tests</title>
<style>
.sid {
/* Keyword values */
user-modify: read-only;
user-modify: read-write;
user-modify: write-only;

/* Global values */
user-modify: inherit;
user-modify: initial;
user-modify: revert;
user-modify: unset;
}

.readwrite {
  -moz-user-modify: read-write;
  -webkit-user-modify: read-write;
}
</style>
</head>

<body>

<h1>MDN user-modify Tests</h1>

<div class="readwrite">The user is able to change this text.</div>

</body>
</html>
