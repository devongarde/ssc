<!DOCTYPE html>
<html>
  <head>
    <title>grid 5 example</title>
  </head>

<BODY>

<style>
.grid {
  display: inline-grid-lanes;
  grid-template-columns: 50px 100px auto;
  grid-gap: 10px;
  border: 1px solid;
}
p { background: silver; margin: 5px; }
</style>

<div class="grid">
  <p style="border:10px solid">1</p>
  <p>2</p>
  <p>3</p>
  <p style="height:50px">4</p>
  <p>5</p>
  <p>6</p>
</div>

</BODY>

</html>
