<!DOCTYPE HTML>
<html>
<head>
<title>MDN STYLE tests</title>
<style>
p {
  color: red;
}
</style>

<style>
  p {
    color: #26b72b;
  }
  code {
    font-weight: bold;
  }
</style>

</head>

<body>

<h1>MDN STYLE Tests</h1>

<p>
  This text will be green. Inline styles take precedence over CSS included
  externally.
</p>

<p style="color: blue">
  The <code>style</code> attribute can override it, though.
</p>

</body>
</html>
