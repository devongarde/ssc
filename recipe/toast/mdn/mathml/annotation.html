<!DOCTYPE HTML>
<html>
<head>
<title>MDN mathml annotation tests</title>
</head>

<body>

<h1>MDN mathml annotation Tests</h1>

<math display="block">
  <semantics>
    <!-- The first child is the MathML expression rendered by default. -->
    <mrow>
      <msup>
        <mi>x</mi>
        <mn>2</mn>
      </msup>
      <mo>+</mo>
      <mi>y</mi>
    </mrow>

    <!-- Annotate with LaTeX, a lightweight markup language. -->
    <annotation encoding="application/x-tex">x^{2} + y</annotation>
  </semantics>
</math>

</body>
</html>
