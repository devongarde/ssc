<!DOCTYPE HTML>
<html>
<head>
<title>MDN direction tests</title>
<style>
.sid {
/* Keyword values */
direction: ltr;
direction: rtl;

/* Global values */
direction: inherit;
direction: initial;
direction: revert;
direction: revert-layer;
direction: unset;
}

blockquote {
  direction: rtl;
  width: 300px;
}
</style>
</head>

<body>

<h1>MDN direction Tests</h1>

<blockquote>
  <p>This paragraph is in English but incorrectly goes right to left.</p>
  <p></p>
</blockquote>

<blockquote>
  <p>هذه الفقرة باللغة العربية ، لذا يجب الانتقال من اليمين إلى اليسار.</p>
  <p></p>
</blockquote>

</body>
</html>
